name: Trade.2026 Monitor Cron (15m)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Monitor Cron Endpoint
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MONITOR_URL" ]; then
            echo "MONITOR_URL secret is not set. Skipping."
            exit 0
          fi
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$MONITOR_URL/api/monitor/cron"
          else
            curl -fsS "$MONITOR_URL/api/monitor/cron"
          fi
