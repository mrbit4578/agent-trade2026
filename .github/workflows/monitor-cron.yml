name: Trade.2026 Monitor Cron (15m)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Trade.2026 Monitor Endpoint
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_URL" ]; then
            echo "MONITOR_URL secret is not set. Skipping."
            exit 0
          fi
          if [ -z "$MONITOR_SECRET" ]; then
            echo "MONITOR_SECRET secret is not set."
            exit 1
          fi
          TARGET_URL="${MONITOR_URL%/}"
          case "$TARGET_URL" in
            */api/monitor/run)
              curl -fsS -X POST "$TARGET_URL" \
                -H "Authorization: Bearer $MONITOR_SECRET" \
                -H "Content-Type: application/json" \
                -d '{"mode":"auto","windowHours":24,"sendTelegram":true}'
              ;;
            */api/monitor/cron)
              curl -fsS -X GET "$TARGET_URL" \
                -H "Authorization: Bearer $MONITOR_SECRET"
              ;;
            *)
              curl -fsS -X POST "$TARGET_URL/api/monitor/run" \
                -H "Authorization: Bearer $MONITOR_SECRET" \
                -H "Content-Type: application/json" \
                -d '{"mode":"auto","windowHours":24,"sendTelegram":true}'
              ;;
          esac
